<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pocket Ledger</title>
    <meta
      name="description"
      content="Track income, expenses, budgets and savings goals. Private, offline-first, and yours."
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />

    <!-- Icons -->
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/icons/icon.svg" color="#5653cf" />

    <!-- Prevent a white flash before the theme script runs -->
    <style>
      html {
        background: #f4f4f7;
      }
      [data-theme="dark"] {
        background: #08080b;
      }
    </style>

    <script>
      // Apply the stored theme before first paint so there is never a flash.
      (function () {
        try {
          var stored = null;
          try {
            stored = localStorage.getItem("pocket-ledger-theme");
          } catch (e) {}
          var theme = stored === "light" || stored === "dark" ? stored : "system";
          if (theme === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 34rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1 style="font-size: 1.25rem; margin: 0 0 0.5rem">Pocket Ledger needs JavaScript</h1>
        <p style="color: #5c5c69; margin: 0">
          This app runs entirely in your browser and stores your records in IndexedDB, which requires
          JavaScript to be enabled.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
