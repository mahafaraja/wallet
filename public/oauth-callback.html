<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocket Ledger — Sign in with Google</title>
  </head>
  <body>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const error = params.get("error");

        if (error) {
          window.location.href = `/?error=${encodeURIComponent(error)}`;
          return;
        }

        if (!code) {
          window.location.href = `/?error=no_code`;
          return;
        }

        // The client_id was stored by the app before redirecting to Google.
        const clientId = localStorage.getItem("pocket-ledger-drive-client-id");
        const redirectUri =
          window.location.protocol + "//" + window.location.host + "/oauth-callback";

        if (!clientId) {
          window.location.href = `/?error=no_client_id`;
          return;
        }

        // Exchange the authorization code for access + refresh tokens.
        fetch("https://oauth2.googleapis.com/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            code: code,
            client_id: clientId,
            redirect_uri: redirectUri,
            grant_type: "authorization_code",
          }),
        })
          .then(async (res) => {
            if (!res.ok) {
              const text = await res.text();
              throw new Error(`Token exchange failed: ${res.status} ${text}`);
            }
            return res.json();
          })
          .then((data) => {
            const expiresAt = Date.now() + data.expires_in * 1000 - 60000; // 1 min margin
            localStorage.setItem("pocket-ledger-drive-access-token", data.access_token);
            localStorage.setItem("pocket-ledger-drive-expires-at", String(expiresAt));
            if (data.refresh_token) {
              localStorage.setItem("pocket-ledger-drive-refresh-token", data.refresh_token);
            }
            // Redirect back to the app; tokens are now in localStorage.
            window.location.href = "/";
          })
          .catch((err) => {
            window.location.href = `/?error=${encodeURIComponent(err.message)}`;
          });
      })();
    </script>
  </body>
</html>
