<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Pocket Ledger application mark.
    A simple geometric target: a ring and a dot, readable at 16px.
    Flat, single accent colour, no illustration, no text.
  -->
